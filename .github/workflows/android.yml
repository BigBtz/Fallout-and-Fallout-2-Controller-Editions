name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: ${{ matrix.game }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        game: [fallout1-ce, fallout2-ce]

    defaults:
      run:
        working-directory: ${{ matrix.game }}/os/android

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.game }}/os/android/app/.cxx
          key: android-cmake-${{ matrix.game }}-${{ hashFiles(format('{0}/CMakeLists.txt', matrix.game), format('{0}/third_party/**/CMakeLists.txt', matrix.game)) }}

      - name: Setup signing config
        # Optional: add these two repo secrets to keep the same debug key between
        # runs, so new APKs install over old ones without uninstalling.
        if: env.KEYSTORE_FILE_BASE64 != '' && env.KEYSTORE_PROPERTIES_FILE_BASE64 != ''
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > debug.keystore
          echo "$KEYSTORE_PROPERTIES_FILE_BASE64" | base64 --decode > debug-keystore.properties
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PROPERTIES_FILE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PROPERTIES_FILE_BASE64 }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-controller-android
          path: ${{ matrix.game }}/os/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
